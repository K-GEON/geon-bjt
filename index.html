<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Geon BJT</title>
<!--
  Geon 엔진 (모듈식 구조)
  - 이 파일: 화면과 동작(엔진). 학습 내용은 들어 있지 않다.
  - modules/*.js: 모듈 하나 = 하단 메뉴 버튼 하나. 각 파일이 window.GEON_MODULES에 자기 정의를 추가한다.
  - 모듈 추가 절차: (1) modules/새모듈.js 추가 (2) 아래 [모듈 등록] 구역에 script 한 줄 추가 (3) sw.js의 FILES와 CACHE 이름 갱신.
  - 학습 기록 키: geon:<모듈id>:rec / geon:<모듈id>:ui. 단어 키 = 표기|읽기.
-->
<style>
:root{
  --bg:#f5f5f3; --surface:#ffffff; --ink:#17202c; --muted:#5f6977; --meaning:#1f3555;
  --line:#c9ced6; --track:#e6e8ec; --accent:#3a3f5c; --on-accent:#ffffff;
  --star:#b98418; --gold-text:#8a6110; --badge-bg:#e3eef0; --badge-fg:#17202c;
  --done-card:#ebecee; --danger:#b23b2e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151c; --surface:#1a212b; --ink:#e8ecf1; --muted:#a0aab7; --meaning:#c9d6ec;
    --line:#323c4a; --track:#2a3340; --accent:#a9c1ea; --on-accent:#10151c;
    --star:#e3aa45; --gold-text:#e3aa45; --badge-bg:#243246; --badge-fg:#c9d6ec;
    --done-card:#151b23; --danger:#ef9a8c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#1a212b; --ink:#e8ecf1; --muted:#a0aab7; --meaning:#c9d6ec;
  --line:#323c4a; --track:#2a3340; --accent:#a9c1ea; --on-accent:#10151c;
  --star:#e3aa45; --gold-text:#e3aa45; --badge-bg:#243246; --badge-fg:#c9d6ec;
  --done-card:#151b23; --danger:#ef9a8c;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
.jp{font-family:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 앱 높이는 vh 단위가 아니라 실제 창 높이(JS 측정값)로 고정: 설치형 앱에서 하단 메뉴가 화면 밖으로 밀리는 문제 방지 */
#app{position:fixed;top:0;left:0;right:0;height:var(--app-h,100%);display:flex;flex-direction:column}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px 20px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.title{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.title.big{font-size:34px}
.sub{margin-top:4px;font-size:15px;color:var(--muted)}

.search{width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;outline:none}
.search::placeholder{color:var(--muted)}
.levels{display:grid;gap:8px}
.chip{height:44px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;font-size:15px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tags{display:flex;gap:8px}
.tags .chip{padding:0 14px}
.count{font-size:15px;color:var(--muted)}

.list{display:flex;flex-direction:column;gap:10px}
.card{position:relative;background:var(--surface);border-radius:16px}
.card.done{background:var(--done-card)}
.card.compact .card-main{padding:0 60px 0 16px;min-height:52px;flex-direction:row;align-items:center}
.card.compact .w{font-size:18px;font-weight:500;color:var(--muted)}
.card.compact .star{top:4px}
.card-main{width:100%;border:0;background:transparent;text-align:left;padding:16px 60px 16px 16px;display:flex;flex-direction:column;gap:10px}
.head{display:flex;align-items:center;gap:14px;min-width:0}
.badge{flex:none;width:44px;height:44px;border-radius:50%;background:var(--badge-bg);color:var(--badge-fg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.wr{display:flex;flex-direction:column;min-width:0}
.w{font-size:24px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.r{font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.m{font-size:17px;font-weight:700;line-height:1.45;color:var(--meaning)}
.star{position:absolute;top:16px;right:8px;width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.star path{fill:none;stroke:var(--star);stroke-width:1.4;stroke-linejoin:round}
.star[aria-pressed="true"] path{fill:var(--star)}
.detail{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.rel{margin:0;font-size:15px;line-height:1.6;color:var(--muted)}
.rel b{font-weight:500;margin-right:6px}
.rel .jp{color:var(--ink)}
.done-btn{align-self:flex-start;height:44px;padding:0 20px;border-radius:22px;border:1px solid var(--line);background:transparent;color:var(--gold-text);font-size:15px;font-weight:700}
.done-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.empty{padding:28px 16px;border-radius:16px;background:var(--surface);text-align:center;color:var(--muted);font-size:15px;line-height:1.6}

.panel{background:var(--surface);border-radius:16px;padding:16px}
.label{font-size:14px;color:var(--muted)}
.pname{margin-top:2px;font-size:20px;font-weight:700}
.prow{margin-top:14px;display:flex;justify-content:space-between;gap:12px;font-size:15px}
.prow b{font-weight:700}
.bar{margin-top:8px;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.rows{padding:4px 0}
.row{width:100%;min-height:52px;border:0;background:transparent;text-align:left;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.row b{font-size:16px}
.row span{font-size:15px;color:var(--muted)}
.ptitle{font-size:16px;font-weight:700}
.seg{margin-top:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:3px;border-radius:10px;background:var(--track)}
.seg button{height:40px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700}
.mod{margin-top:12px;display:flex;align-items:center;gap:12px}
.micon{flex:none;width:44px;height:44px;border-radius:12px;background:var(--badge-bg);color:var(--badge-fg);display:flex;align-items:center;justify-content:center}
.mtext{display:flex;flex-direction:column;gap:2px;min-width:0}
.mtext b{font-size:15px}
.mtext span{font-size:14px;color:var(--muted)}
.danger{width:100%;min-height:52px;border:0;border-radius:16px;background:var(--surface);color:var(--danger);font-size:16px;text-align:left;padding:0 16px}

#nav{flex:none;display:grid;background:var(--surface);padding:10px 8px calc(env(safe-area-inset-bottom,0px) + 12px)}
#nav button{min-height:52px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
#nav .pill{width:64px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
#nav button[aria-current="page"] .pill{background:var(--accent);color:var(--on-accent)}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <nav id="nav" aria-label="메뉴"></nav>
</div>

<!-- ===== [모듈 등록] 모듈 파일을 한 줄씩 추가 ===== -->
<script src="modules/bjt.js"></script>

<!-- ===== [엔진] ===== -->
<script>
(function () {
  'use strict';
  var APP = { name: 'Geon BJT', version: '1.3' };

  // ---------- 화면 높이 고정 ----------
  function fitHeight() {
    var h = window.innerHeight, c = document.documentElement.clientHeight;
    if (c && c < h) h = c;
    document.documentElement.style.setProperty('--app-h', h + 'px');
  }
  fitHeight();
  window.addEventListener('resize', fitHeight);
  window.addEventListener('orientationchange', function () { setTimeout(fitHeight, 300); });
  window.addEventListener('pageshow', fitHeight);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) fitHeight(); });

  var ICONS = {
    home: '<path d="M4 11l8-6.5 8 6.5"/><path d="M6.5 9.5V19h11V9.5"/>',
    book: '<path d="M5 4.5h10a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/>',
    gear: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>'
  };
  var STAR = '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>';
  function icon(name) { return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || ICONS.book) + '</svg>'; }

  // ---------- 저장 ----------
  function load(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // ---------- 모듈 적재 ----------
  var MODS = (window.GEON_MODULES || []).filter(function (m) {
    return m && m.id && m.name && m.type === 'vocab' && Array.isArray(m.levels) && Array.isArray(m.words);
  }).map(function (m) {
    var words = m.words.map(function (a, i) {
      var rel = Array.isArray(a[4]) ? a[4] : [];
      return { i: i, w: a[0], r: a[1] || '', m: a[2], lv: a[3], rel: rel, k: a[0] + '|' + (a[1] || ''),
        hay: (a[0] + '\n' + (a[1] || '') + '\n' + a[2]).toLowerCase() };
    });
    var rec = load('geon:' + m.id + ':rec', null) || {};
    rec.star = rec.star || {}; rec.done = rec.done || {};
    var ui = load('geon:' + m.id + ':ui', null) || {};
    if (ui.level && m.levels.indexOf(ui.level) === -1) ui.level = null;
    return { def: m, id: m.id, words: words, rec: rec,
      ui: { level: ui.level || null, star: !!ui.star, done: !!ui.done }, q: '', open: -1 };
  });
  var MOD = {}; MODS.forEach(function (m) { MOD[m.id] = m; });
  function saveRec(m) { save('geon:' + m.id + ':rec', m.rec); }
  function saveUi(m) { save('geon:' + m.id + ':ui', m.ui); }

  // ---------- 상태 ----------
  var route = load('geon:route', 'home');
  if (route !== 'home' && route !== 'settings' && !MOD[route]) route = 'home';
  var theme = load('geon:theme', 'auto');
  if (['auto', 'light', 'dark'].indexOf(theme) === -1) theme = 'auto';
  var metaTheme = document.querySelector('meta[name="theme-color"]');
  function applyTheme() {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    if (metaTheme) metaTheme.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#f5f5f3');
  }
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function () { if (theme === 'auto') applyTheme(); });
  }

  var main = document.getElementById('main');
  var nav = document.getElementById('nav');

  // ---------- 하단 메뉴 ----------
  function navItems() {
    return [{ id: 'home', label: '홈', icon: 'home' }]
      .concat(MODS.map(function (m) { return { id: m.id, label: m.def.name, icon: m.def.icon }; }))
      .concat([{ id: 'settings', label: '설정', icon: 'gear' }]);
  }
  function renderNav() {
    var items = navItems();
    nav.style.gridTemplateColumns = 'repeat(' + items.length + ', minmax(0, 1fr))';
    nav.innerHTML = items.map(function (it) {
      return '<button type="button" data-route="' + esc(it.id) + '" aria-label="' + esc(it.label) + '"' +
        (it.id === route ? ' aria-current="page"' : '') + '><span class="pill">' + icon(it.icon) + '</span></button>';
    }).join('');
  }
  function go(r) {
    route = r; save('geon:route', r);
    renderNav(); renderMain(); main.scrollTop = 0;
  }

  // ---------- 단어장 ----------
  function filtered(m) {
    var q = m.q.trim().toLowerCase();
    return m.words.filter(function (x) {
      if (m.ui.level && x.lv !== m.ui.level) return false;
      if (m.ui.star && !m.rec.star[x.k]) return false;
      if (m.ui.done && !m.rec.done[x.k]) return false;
      if (q && x.hay.indexOf(q) === -1) return false;
      return true;
    });
  }
  function detailHtml(m, x) {
    var done = !!m.rec.done[x.k];
    var rel = x.rel.length
      ? '<p class="rel"><b>관련어</b><span class="jp" lang="ja">' + esc(x.rel.join('・')) + '</span></p>' : '';
    return '<div class="detail">' + rel +
      '<button type="button" class="done-btn" aria-pressed="' + done + '">' + (done ? '✓ 학습 완료됨' : '+ 학습 완료') + '</button></div>';
  }
  function starHtml(m, x) {
    return '<button type="button" class="star" aria-label="즐겨찾기" aria-pressed="' + !!m.rec.star[x.k] + '">' + STAR + '</button>';
  }
  function cardHtml(m, x) {
    var open = m.open === x.i, done = !!m.rec.done[x.k];
    if (done && !open) {
      return '<div class="card done compact" data-i="' + x.i + '">' +
        '<button type="button" class="card-main" aria-expanded="false" aria-label="' + esc(x.w + ', 학습 완료') + '">' +
        '<span class="w jp" lang="ja">' + esc(x.w) + '</span></button>' + starHtml(m, x) + '</div>';
    }
    return '<div class="card' + (done ? ' done' : '') + '" data-i="' + x.i + '">' +
      '<button type="button" class="card-main" aria-expanded="' + open + '">' +
        '<span class="head"><span class="badge">' + esc(x.lv) + '</span><span class="wr">' +
          '<span class="w jp" lang="ja">' + esc(x.w) + '</span>' +
          (x.r ? '<span class="r jp" lang="ja">' + esc(x.r) + '</span>' : '') +
        '</span></span>' +
        '<span class="m">' + esc(x.m) + '</span>' +
      '</button>' +
      starHtml(m, x) + (open ? detailHtml(m, x) : '') + '</div>';
  }
  function replaceCard(m, i) {
    var el = main.querySelector('.card[data-i="' + i + '"]');
    if (!el) return null;
    el.insertAdjacentHTML('afterend', cardHtml(m, m.words[i]));
    var n = el.nextElementSibling; el.remove(); return n;
  }
  function renderList(m) {
    var list = main.querySelector('.list'), cnt = main.querySelector('.count');
    if (!list) return;
    var items = filtered(m);
    if (m.open !== -1 && !items.some(function (x) { return x.i === m.open; })) m.open = -1;
    cnt.textContent = items.length + '단어';
    list.innerHTML = items.length
      ? items.map(function (x) { return cardHtml(m, x); }).join('')
      : '<div class="empty">조건에 맞는 단어가 없습니다. 등급이나 태그를 바꿔 보세요.</div>';
  }
  function renderVocab(m) {
    var d = m.def;
    main.innerHTML = '<div class="wrap" data-mod="' + esc(m.id) + '">' +
      '<div><h1 class="title">' + esc(d.title || d.name) + '</h1><div class="sub">' + esc(APP.name + ' ' + APP.version) + '</div></div>' +
      '<input class="search" type="search" placeholder="단어, 읽기, 뜻 검색" aria-label="검색" value="' + esc(m.q) + '" autocomplete="off">' +
      '<div class="levels" style="grid-template-columns:repeat(' + d.levels.length + ',minmax(0,1fr))">' +
        d.levels.map(function (lv) {
          return '<button type="button" class="chip" data-level="' + esc(lv) + '" aria-pressed="' + (m.ui.level === lv) + '">' + esc(lv) + '</button>';
        }).join('') + '</div>' +
      '<div class="tags">' +
        '<button type="button" class="chip" data-tag="star" aria-pressed="' + m.ui.star + '">★ 즐겨찾기</button>' +
        '<button type="button" class="chip" data-tag="done" aria-pressed="' + m.ui.done + '">✓ 학습 완료</button>' +
      '</div>' +
      '<div class="count" aria-live="polite"></div>' +
      '<div class="list"></div></div>';
    renderList(m);
  }

  // ---------- 홈 ----------
  function stats(m, lv) {
    var n = 0, d = 0;
    m.words.forEach(function (x) { if (!lv || x.lv === lv) { n++; if (m.rec.done[x.k]) d++; } });
    return { n: n, d: d };
  }
  function renderHome() {
    var h = '<div class="wrap"><div><h1 class="title big">' + esc(APP.name + ' ' + APP.version) + '</h1></div>';
    if (!MODS.length) h += '<div class="empty">설치된 모듈이 없습니다.</div>';
    MODS.forEach(function (m) {
      var t = stats(m), pct = t.n ? Math.round(t.d / t.n * 100) : 0;
      h += '<div class="panel"><div class="label">모듈</div><div class="pname">' + esc(m.def.name) + '</div>' +
        '<div class="prow"><span>전체 진행</span><b>' + t.n + '개 중 ' + t.d + '개 완료</b></div>' +
        '<div class="bar"><span style="width:' + pct + '%"></span></div></div>';
      h += '<div class="panel rows" style="padding:4px 0">' + m.def.levels.map(function (lv) {
        var s = stats(m, lv);
        return '<button type="button" class="row" data-open-mod="' + esc(m.id) + '" data-open-level="' + esc(lv) + '"><b>' + esc(lv) + '</b><span>' + s.n + '개 중 ' + s.d + '개 완료</span></button>';
      }).join('') + '</div>';
    });
    main.innerHTML = h + '</div>';
  }

  // ---------- 설정 ----------
  var armed = null, cleared = null, armTimer = null;
  function renderSettings() {
    var h = '<div class="wrap"><div><h1 class="title">설정</h1><div class="sub">' + esc(APP.name + ' ' + APP.version) + '</div></div>';
    h += '<div class="panel"><div class="ptitle">화면 모드</div><div class="seg">' +
      [['auto', '자동'], ['light', '라이트'], ['dark', '다크']].map(function (a) {
        return '<button type="button" data-theme-pick="' + a[0] + '" aria-pressed="' + (theme === a[0]) + '">' + a[1] + '</button>';
      }).join('') + '</div></div>';
    h += '<div class="panel"><div class="ptitle">설치된 모듈</div>' + MODS.map(function (m) {
      var d = m.def, lv = d.levels.length ? d.levels[0] + '~' + d.levels[d.levels.length - 1] : '';
      return '<div class="mod"><span class="micon">' + icon(d.icon) + '</span><span class="mtext"><b>' + esc(d.name) + '</b>' +
        '<span>버전 ' + esc(d.version || '') + ', 단어 ' + m.words.length + '개, 등급 ' + esc(lv) + '</span>' +
        (d.note ? '<span>' + esc(d.note) + '</span>' : '') + '</span></div>';
    }).join('') + '</div>';
    MODS.forEach(function (m) {
      h += '<button type="button" class="danger" data-reset="' + esc(m.id) + '">' +
        (armed === m.id ? '한 번 더 누르면 지워집니다' : cleared === m.id ? '학습 기록을 지웠습니다' : esc(m.def.name) + ' 학습 기록 지우기') + '</button>';
    });
    main.innerHTML = h + '</div>';
  }

  function renderMain() {
    if (route === 'home') renderHome();
    else if (route === 'settings') renderSettings();
    else renderVocab(MOD[route]);
  }

  // ---------- 조작 ----------
  nav.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-route]');
    if (b && b.getAttribute('data-route') !== route) go(b.getAttribute('data-route'));
  });

  main.addEventListener('input', function (e) {
    if (!e.target.classList.contains('search')) return;
    var m = MOD[route]; if (!m) return;
    m.q = e.target.value; m.open = -1; renderList(m);
  });

  main.addEventListener('click', function (e) {
    var t = e.target, b;
    var m = MOD[route];

    if (m) {
      if ((b = t.closest('[data-level]'))) {
        var lv = b.getAttribute('data-level');
        m.ui.level = m.ui.level === lv ? null : lv; saveUi(m); m.open = -1;
        main.querySelectorAll('[data-level]').forEach(function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-level') === m.ui.level)); });
        renderList(m); return;
      }
      if ((b = t.closest('[data-tag]'))) {
        var tag = b.getAttribute('data-tag');
        m.ui[tag] = !m.ui[tag]; saveUi(m); m.open = -1;
        b.setAttribute('aria-pressed', String(m.ui[tag]));
        renderList(m); return;
      }
      var card = t.closest('.card');
      if (card) {
        var x = m.words[+card.getAttribute('data-i')];
        if ((b = t.closest('.star'))) {
          if (m.rec.star[x.k]) delete m.rec.star[x.k]; else m.rec.star[x.k] = 1;
          saveRec(m); b.setAttribute('aria-pressed', String(!!m.rec.star[x.k])); return;
        }
        if ((b = t.closest('.done-btn'))) {
          if (m.rec.done[x.k]) delete m.rec.done[x.k]; else m.rec.done[x.k] = 1;
          saveRec(m);
          var nc = replaceCard(m, x.i);
          if (nc) { var nb = nc.querySelector('.done-btn'); if (nb) nb.focus(); }
          return;
        }
        if (t.closest('.card-main')) {
          var prev = m.open;
          m.open = prev === x.i ? -1 : x.i;
          if (prev !== -1 && prev !== x.i) replaceCard(m, prev);
          var cur = replaceCard(m, x.i);
          if (cur && m.open === x.i) {
            var r = cur.getBoundingClientRect(), mr = main.getBoundingClientRect();
            if (r.bottom > mr.bottom) main.scrollTop += r.bottom - mr.bottom + 12;
            if (r.top < mr.top) main.scrollTop -= mr.top - r.top + 12;
          }
          return;
        }
      }
      return;
    }

    if ((b = t.closest('[data-open-mod]'))) {
      var om = MOD[b.getAttribute('data-open-mod')];
      if (om) { om.ui.level = b.getAttribute('data-open-level'); om.ui.star = false; om.ui.done = false; om.q = ''; om.open = -1; saveUi(om); go(om.id); }
      return;
    }
    if ((b = t.closest('[data-theme-pick]'))) {
      theme = b.getAttribute('data-theme-pick'); save('geon:theme', theme); applyTheme(); renderSettings(); return;
    }
    if ((b = t.closest('[data-reset]'))) {
      var id = b.getAttribute('data-reset');
      clearTimeout(armTimer);
      if (armed === id) {
        armed = null; cleared = id;
        var rm = MOD[id]; rm.rec = { star: {}, done: {} }; rm.open = -1; saveRec(rm);
      } else {
        armed = id; cleared = null;
      }
      armTimer = setTimeout(function () { armed = null; cleared = null; if (route === 'settings') renderSettings(); }, 4000);
      renderSettings(); return;
    }
  });

  applyTheme(); renderNav(); renderMain();

  // 업데이트: 새 버전이 설치되면 한 번 자동으로 다시 열어 바로 적용(첫 설치 때는 하지 않음)
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    var hadController = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (hadController && !reloaded) { reloaded = true; location.reload(); }
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        if (reg && reg.update) reg.update().catch(function () {});
      }).catch(function () {});
    });
  }
})();
</script>
</body>
</html>
